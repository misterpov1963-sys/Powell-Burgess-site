                </div>
                <div>

            "Zoroaya Hernandez",
            "Jonathan Jimenez",

            "Michael Rivera"
        ];

            "Area Washdown",
            "Pressure washing",
            "Night 1 Facilitation",
            "Trainer on Duty"
        ];

        function saveData() {
            localStorage.setItem('disney_3rd_shift_recap', JSON.stringify(appData));
        }

        function renderTabs() {
            const container = document.getElementById('leaderTabs');
            container.innerHTML = '';
            appData.leaders.forEach(leader => {
                const isActive = leader.name === appData.activeTab;
                let statusColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
                if (leader.status === 'Off') statusColor = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                if (leader.status === 'Leave of Absence') statusColor = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
                if (leader.status === 'Covering Overnight Duty') statusColor = 'bg-purple-500/20 text-purple-400 border-purple-500/30';

                const btn = document.createElement('button');
                btn.className = `px-4 py-3 rounded-xl font-medium text-sm whitespace-nowrap transition flex items-center gap-2.5 border ${isActive ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'}`;
                btn.innerHTML = `
                    <span>${leader.name}</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full border ${statusColor}">${leader.status}</span>
                `;
                btn.onclick = () => {
                    appData.activeTab = leader.name;
                    renderApp();
                };
                container.appendChild(btn);
            });
        }

        function renderApp() {
            renderTabs();
            const container = document.getElementById('tabContentContainer');
            const leader = appData.leaders.find(l => l.name === appData.activeTab) || appData.leaders[0];

            let statusColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
            if (leader.status === 'Off') statusColor = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
            if (leader.status === 'Leave of Absence') statusColor = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
            if (leader.status === 'Covering Overnight Duty') statusColor = 'bg-purple-500/20 text-purple-400 border-purple-500/30';

            container.innerHTML = `

                        <div class="flex items-center gap-3">
                            <h2 class="text-2xl font-bold text-white">${leader.name}</h2>

                    </div>

                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Operational Status:</label>

                            <option value="Leave of Absence" ${leader.status === 'Leave of Absence' ? 'selected' : ''}>Leave of Absence (LOA)</option>

                        </button>
                    </div>

                        <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-xl">
                            <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Scheduled Labor (Hrs)</span>
                            <input type="number" step="0.1" id="schedLabor" value="${leader.metrics.scheduled.toFixed(1)}" onblur="formatDecimalInput(this)" oninput="syncMetrics('${leader.name}')" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-lg font-bold text-white mt-1 focus:outline-none focus:border-cyan-500">
                        </div>
                        <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-xl">
                            <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Actual Labor (Hrs)</span>
                            <input type="number" step="0.1" id="actualLabor" value="${leader.metrics.actual.toFixed(1)}" onblur="formatDecimalInput(this)" oninput="syncMetrics('${leader.name}')" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-lg font-bold text-emerald-400 mt-1 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-xl">
                            <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Call In Factor (Hrs)</span>
                            <input type="number" step="0.1" id="callInFactor" value="${leader.metrics.callIn.toFixed(1)}" onblur="formatDecimalInput(this)" oninput="syncMetrics('${leader.name}')" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-lg font-bold text-amber-400 mt-1 focus:outline-none focus:border-amber-500">
                        </div>
                        <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-xl">
                            <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Labor Variance (Hrs)</span>

                        </div>

                            <span id="dispVarPct" class="text-lg font-bold text-indigo-400 block mt-1">${leader.metrics.variancePct.toFixed(4)}</span>

                        </div>
                    </div>

                    <div class="mt-4 pt-4 border-t border-slate-800">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Cast Member Attendance Breakdown (Headcount & Status Codes)</h4>
                        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                <span class="text-[10px] text-slate-400 block uppercase">Cast Present</span>
                                <input type="number" id="hcPresent" value="${leader.headcount.present}" oninput="syncHeadcount('${leader.name}')" class="w-16 bg-slate-900 border border-slate-700 text-center font-bold text-white rounded p-1 mt-1">
                            </div>
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                <span class="text-[10px] text-amber-400 block uppercase">Call Sick</span>
                                <input type="number" id="hcSick" value="${leader.headcount.callSick}" oninput="syncHeadcount('${leader.name}')" class="w-16 bg-slate-900 border border-slate-700 text-center font-bold text-white rounded p-1 mt-1">
                            </div>
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">

                            </div>
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                <span class="text-[10px] text-blue-400 block uppercase">ADO</span>
                                <input type="number" id="hcAdo" value="${leader.headcount.ado}" oninput="syncHeadcount('${leader.name}')" class="w-16 bg-slate-900 border border-slate-700 text-center font-bold text-white rounded p-1 mt-1">
                            </div>
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                <span class="text-[10px] text-rose-400 block uppercase">ER (Emergency)</span>
                                <input type="number" id="hcEr" value="${leader.headcount.er}" oninput="syncHeadcount('${leader.name}')" class="w-16 bg-slate-900 border border-slate-700 text-center font-bold text-white rounded p-1 mt-1">
                            </div>
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                <span class="text-[10px] text-emerald-400 block uppercase">ROS</span>
                                <input type="number" id="hcRos" value="${leader.headcount.ros}" oninput="syncHeadcount('${leader.name}')" class="w-16 bg-slate-900 border border-slate-700 text-center font-bold text-white rounded p-1 mt-1">
                            </div>
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                <span class="text-[10px] text-orange-400 block uppercase">Late</span>
                                <input type="number" id="hcLate" value="${leader.headcount.late}" oninput="syncHeadcount('${leader.name}')" class="w-16 bg-slate-900 border border-slate-700 text-center font-bold text-white rounded p-1 mt-1">
                            </div>
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                <span class="text-[10px] text-cyan-400 block uppercase">Total Headcount</span>
                                <span id="hcTotalDisplay" class="text-base font-bold text-white block mt-1">${leader.headcount.totalSched}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Leadership End of Shift Logs -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
                            <i class="fa-solid fa-clipboard-user"></i> 2. Leadership End of Shift Logs & Detailed Comments
                        </h3>
                        <button onclick="addLogEntry('${leader.name}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-md shadow-amber-500/20">
                            <i class="fa-solid fa-plus"></i> Add Log Entry

                    </div>

                    <div class="space-y-3" id="logsContainer">

                                        ${activeLeadersList.map(ldr => `<option value="${ldr}" ${log.leader === ldr ? 'selected' : ''}>${ldr}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="w-full grow">
                                    <span class="text-[10px] text-slate-400 uppercase block mb-1">Shift Activity / Comment</span>
                                    <input type="text" value="${log.detail}" onchange="updateLog('${leader.name}', ${index}, 'detail', this.value)" placeholder="Enter shift activity / comment..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">

                                <button onclick="deleteLog('${leader.name}', ${index})" class="text-slate-500 hover:text-rose-400 p-2 self-end sm:self-center transition"><i class="fa-solid fa-trash-can"></i></button>

                        `).join('')}

                            <i class="fa-solid fa-graduation-cap"></i> 3. Shift Training & Skills Assessment Tracker
                        </h3>
                        <button onclick="addTraining('${leader.name}')" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-md shadow-purple-600/20">
                            <i class="fa-solid fa-plus"></i> Add Training Entry
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs text-slate-300">
                            <thead class="bg-slate-950 text-slate-400 uppercase tracking-wider border-b border-slate-800">
                                <tr>
                                    <th class="p-3">Trainer</th>
                                    <th class="p-3">Trainee</th>
                                    <th class="p-3">Training Module / Focus</th>
                                    <th class="p-3 text-center">Night 1 OJT</th>
                                    <th class="p-3 text-center">Night 2 OJT</th>
                                    <th class="p-3 text-center">Night 3 OJT</th>
                                    <th class="p-3">Training Assessment / Sign-Off</th>
                                    <th class="p-3 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60" id="trainingTableBody">
                                ${leader.training.map((t, idx) => `
                                    <tr class="hover:bg-slate-950/40">
                                        <td class="p-3"><input type="text" value="${t.trainer}" onchange="updateTraining('${leader.name}', ${idx}, 'trainer', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-white"></td>
                                        <td class="p-3"><input type="text" value="${t.trainee}" onchange="updateTraining('${leader.name}', ${idx}, 'trainee', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-white"></td>
                                        <td class="p-3">
                                            <select onchange="updateTraining('${leader.name}', ${idx}, 'module', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 w-full text-xs text-white font-medium">
                                                ${trainingModulesList.map(mod => `<option value="${mod}" ${t.module === mod ? 'selected' : ''}>${mod}</option>`).join('')}
                                            </select>
                                        </td>
                                        <td class="p-3 text-center"><input type="checkbox" ${t.n1 ? 'checked' : ''} onchange="updateTraining('${leader.name}', ${idx}, 'n1', this.checked ? 1 : 0)" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-purple-600 focus:ring-0 cursor-pointer"></td>
                                        <td class="p-3 text-center"><input type="checkbox" ${t.n2 ? 'checked' : ''} onchange="updateTraining('${leader.name}', ${idx}, 'n2', this.checked ? 1 : 0)" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-purple-600 focus:ring-0 cursor-pointer"></td>
                                        <td class="p-3 text-center"><input type="checkbox" ${t.n3 ? 'checked' : ''} onchange="updateTraining('${leader.name}', ${idx}, 'n3', this.checked ? 1 : 0)" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-purple-600 focus:ring-0 cursor-pointer"></td>
                                        <td class="p-3">
                                            <select onchange="updateTraining('${leader.name}', ${idx}, 'assessment', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 w-full text-xs font-semibold ${t.assessment.includes('Passed') ? 'text-emerald-400' : t.assessment.includes('Remediation') ? 'text-rose-400' : 'text-amber-400'}">
                                                <option value="Pending Evaluation" ${t.assessment === 'Pending Evaluation' ? 'selected' : ''}>Pending Evaluation</option>
                                                <option value="Passed - Certified" ${t.assessment === 'Passed - Certified' ? 'selected' : ''}>Passed - Certified</option>
                                                <option value="Needs Remediation" ${t.assessment === 'Needs Remediation' ? 'selected' : ''}>Needs Remediation</option>
                                                <option value="Extended OJT Required" ${t.assessment === 'Extended OJT Required' ? 'selected' : ''}>Extended OJT Required</option>
                                            </select>
                                        </td>
                                        <td class="p-3 text-right"><button onclick="deleteTraining('${leader.name}', ${idx})" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can"></i></button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 4. Specialized Contracts Performance & Status -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-base font-bold text-emerald-400 flex items-center gap-2">
                            <i class="fa-solid fa-file-contract"></i> 4. Specialized Contracts Performance & Status
                        </h3>
                        <button onclick="addContract('${leader.name}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-md shadow-emerald-600/20">
                            <i class="fa-solid fa-plus"></i> Add Contract Task
                        </button>
                    </div>

                    <div class="space-y-3">
                        ${leader.contracts.map((c, idx) => `
                            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between">
                                <div class="w-full md:w-1/4">
                                    <span class="text-[10px] text-slate-400 uppercase block mb-1">Contract Name</span>
                                    <input type="text" value="${c.name}" onchange="updateContract('${leader.name}', ${idx}, 'name', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-bold text-white">
                                </div>
                                <div class="w-full md:w-1/5">
                                    <span class="text-[10px] text-slate-400 uppercase block mb-1">Assigned Lead</span>
                                    <input type="text" value="${c.lead}" onchange="updateContract('${leader.name}', ${idx}, 'lead', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200">
                                </div>
                                <div class="w-full md:w-36">
                                    <span class="text-[10px] text-slate-400 uppercase block mb-1">Status</span>
                                    <select onchange="updateContract('${leader.name}', ${idx}, 'status', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-semibold ${c.status === 'Completed' ? 'text-emerald-400' : 'text-amber-400'}">
                                        <option value="Completed" ${c.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                        <option value="In Progress" ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                        <option value="Pending" ${c.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    </select>
                                </div>
                                <div class="w-full grow">
                                    <span class="text-[10px] text-slate-400 uppercase block mb-1">Scope / Shift Progress Summary</span>
                                    <input type="text" value="${c.scope}" onchange="updateContract('${leader.name}', ${idx}, 'scope', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200">
                                </div>
                                <button onclick="deleteContract('${leader.name}', ${idx})" class="text-slate-500 hover:text-rose-400 p-2 self-end md:self-center"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('currentDateDisplay').innerText = appData.currentDate;
        }

        function updateLeaderStatus(leaderName, status) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.status = status;
            saveData();
            renderApp();
        }

        function syncMetrics(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (!l) return;
            l.metrics.scheduled = parseFloat(document.getElementById('schedLabor').value) || 0.0;
            l.metrics.actual = parseFloat(document.getElementById('actualLabor').value) || 0.0;
            l.metrics.callIn = parseFloat(document.getElementById('callInFactor').value) || 0.0;
            l.metrics.variance = Number((l.metrics.actual - l.metrics.scheduled).toFixed(1));
            l.metrics.variancePct = l.metrics.scheduled > 0 ? Number((l.metrics.variance / l.metrics.scheduled).toFixed(4)) : 0.0000;
            l.metrics.attendanceRate = l.metrics.scheduled > 0 ? Number((l.metrics.actual / l.metrics.scheduled).toFixed(4)) : 0.0000;

            document.getElementById('dispVariance').innerText = l.metrics.variance.toFixed(1);
            document.getElementById('dispVarPct').innerText = l.metrics.variancePct.toFixed(4);
            document.getElementById('dispAttRate').innerText = l.metrics.attendanceRate.toFixed(4);
            saveData();
        }

        function formatDecimalInput(input) {
            let val = parseFloat(input.value);
            if (!isNaN(val)) {
                input.value = val.toFixed(1);
            } else {
                input.value = "0.0";
            }
        }

        function syncHeadcount(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (!l) return;
            l.headcount.present = parseInt(document.getElementById('hcPresent').value) || 0;
            l.headcount.callSick = parseInt(document.getElementById('hcSick').value) || 0;
            l.headcount.fmla = parseInt(document.getElementById('hcFmla').value) || 0;
            l.headcount.ado = parseInt(document.getElementById('hcAdo').value) || 0;
            l.headcount.er = parseInt(document.getElementById('hcEr').value) || 0;
            l.headcount.ros = parseInt(document.getElementById('hcRos').value) || 0;
            l.headcount.late = parseInt(document.getElementById('hcLate').value) || 0;
            l.headcount.totalSched = l.headcount.present + l.headcount.callSick + l.headcount.fmla + l.headcount.ado + l.headcount.er;
            document.getElementById('hcTotalDisplay').innerText = l.headcount.totalSched;
            saveData();
        }

        function recalcMetrics(leaderName) {
            saveData();
            renderApp();
            showToast("Metrics recalculated successfully!");
        }

        function addLogEntry(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.logs.push({ leader: leaderName !== "Joint Leadership Recap" ? leaderName : "Henry Powell", detail: "New shift activity note..." });
            saveData();
            renderApp();
        }

        function updateLog(leaderName, idx, field, val) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.logs[idx]) {
                l.logs[idx][field] = val;
                saveData();
            }
        }

        function updateLogLeader(leaderName, idx, newLeader) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.logs[idx]) {
                l.logs[idx].leader = newLeader;
                saveData();
            }
        }

        function deleteLog(leaderName, idx) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.logs.splice(idx, 1);
            saveData();
            renderApp();
        }

        function addTraining(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.training.push({ trainer: "Lead Name", trainee: "Trainee Name", module: "Area Washdown", n1: 0, n2: 0, n3: 0, assessment: "Pending Evaluation" });
            saveData();
            renderApp();
        }

        function updateTraining(leaderName, idx, field, val) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.training[idx]) {
                l.training[idx][field] = val;
                saveData();
            }
        }

        function deleteTraining(leaderName, idx) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.training.splice(idx, 1);
            saveData();
            renderApp();
        }

        function addContract(leaderName) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.contracts.push({ name: "New Contract Task", lead: leaderName, status: "In Progress", scope: "Scope details..." });
            saveData();
            renderApp();
        }

        function updateContract(leaderName, idx, field, val) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l && l.contracts[idx]) {
                l.contracts[idx][field] = val;
                saveData();
            }
        }

        function deleteContract(leaderName, idx) {
            const l = appData.leaders.find(x => x.name === leaderName);
            if (l) l.contracts.splice(idx, 1);
            saveData();
            renderApp();
        }

        function downloadEmlFile() {
            const leader = appData.leaders.find(l => l.name === appData.activeTab) || appData.leaders[0];
            const subject = `3rd Shift Custodial Operations Recap — ${appData.currentDate} (${leader.name})`;

            let htmlBody = `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin: 0; padding: 10px; background-color: #0b132b; font-family: Arial, sans-serif; text-align: left;">
    <div style="width: 100%; max-width: 600px; margin: 0; background-color: #1c2541; border: 1px solid #3a506b; border-radius: 8px; padding: 20px; color: #f8fafc; text-align: left;">
        <div style="text-align: left; border-bottom: 2px solid #48cae4; padding-bottom: 12px; margin-bottom: 15px;">
            <h2 style="color: #48cae4; margin: 0 0 4px 0; font-size: 18px; text-align: left;">Disney Springs 3rd Shift Operations</h2>
            <p style="color: #94a3b8; margin: 0; font-size: 12px; text-align: left;">End of Shift Leadership Recap — ${appData.currentDate}</p>
        </div>

        <div style="background-color: #0b132b; border: 1px solid #3a506b; border-radius: 6px; padding: 12px; margin-bottom: 12px; text-align: left;">
            <h3 style="color: #ffb703; margin: 0 0 6px 0; font-size: 13px; text-transform: uppercase; text-align: left;">Leader Profile: ${leader.name}</h3>
            <p style="margin: 0; font-size: 12px; color: #cbd5e1; text-align: left;"><strong>Operational Status:</strong> <span style="color: #34d399;">${leader.status}</span></p>
        </div>

        <div style="background-color: #0b132b; border: 1px solid #3a506b; border-radius: 6px; padding: 12px; margin-bottom: 12px; text-align: left;">
            <h3 style="color: #48cae4; margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; text-align: left;">1. Labor & Attendance Metrics</h3>
            <table style="width: 100%; border-collapse: collapse; font-size: 11px; text-align: left;">
                <tr style="background-color: #3a506b; color: #ffffff;">
                    <th style="padding: 5px; border: 1px solid #475569; text-align: left;">Scheduled</th>
                    <th style="padding: 5px; border: 1px solid #475569; text-align: left;">Actual</th>
                    <th style="padding: 5px; border: 1px solid #475569; text-align: left;">Call-In</th>
                    <th style="padding: 5px; border: 1px solid #475569; text-align: left;">Variance</th>
                    <th style="padding: 5px; border: 1px solid #475569; text-align: left;">Attendance</th>
                </tr>
                <tr>
                    <td style="padding: 5px; border: 1px solid #475569; text-align: left;">${leader.metrics.scheduled.toFixed(1)}h</td>
                    <td style="padding: 5px; border: 1px solid #475569; text-align: left;">${leader.metrics.actual.toFixed(1)}h</td>
                    <td style="padding: 5px; border: 1px solid #475569; text-align: left;">${leader.metrics.callIn.toFixed(1)}h</td>
                    <td style="padding: 5px; border: 1px solid #475569; text-align: left;">${leader.metrics.variance.toFixed(1)}h</td>
                    <td style="padding: 5px; border: 1px solid #475569; text-align: left; color: #48cae4; font-weight: bold;">${(leader.metrics.attendanceRate * 100).toFixed(1)}%</td>
                </tr>
            </table>
        </div>

        <div style="background-color: #0b132b; border: 1px solid #3a506b; border-radius: 6px; padding: 12px; margin-bottom: 12px; text-align: left;">
            <h3 style="color: #ffb703; margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; text-align: left;">2. Shift Logs & Comments</h3>
            <ul style="padding-left: 15px; margin: 0; font-size: 11px; color: #cbd5e1; line-height: 1.5; text-align: left;">
                ${leader.logs.map(l => `<li style="text-align: left; margin-bottom: 4px;"><strong style="color: #ffb703;">[${l.leader}]</strong> ${l.detail}</li>`).join('')}
            </ul>
        </div>

        <div style="background-color: #0b132b; border: 1px solid #3a506b; border-radius: 6px; padding: 12px; margin-bottom: 12px; text-align: left;">
            <h3 style="color: #c084fc; margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; text-align: left;">3. Training & OJT Assessment</h3>
            <ul style="padding-left: 15px; margin: 0; font-size: 11px; color: #cbd5e1; line-height: 1.5; text-align: left;">
                ${leader.training.map(t => `<li style="text-align: left; margin-bottom: 4px;"><strong style="color: #f8fafc;">${t.trainee}</strong> (${t.module}) — Trainer: ${t.trainer} | Status: <span style="color: #34d399; font-weight: bold;">${t.assessment}</span></li>`).join('')}
            </ul>
        </div>

        <div style="background-color: #0b132b; border: 1px solid #3a506b; border-radius: 6px; padding: 12px; text-align: left;">
            <h3 style="color: #34d399; margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; text-align: left;">4. Specialized Contracts & Status</h3>
            <ul style="padding-left: 15px; margin: 0; font-size: 11px; color: #cbd5e1; line-height: 1.5; text-align: left;">
                ${leader.contracts.map(c => `<li style="text-align: left; margin-bottom: 4px;"><strong style="color: #f8fafc;">${c.name}</strong> (${c.status}) — Lead: ${c.lead}<br><span style="color: #94a3b8;">Scope: ${c.scope}</span></li>`).join('')}
            </ul>
        </div>

        <p style="text-align: left; font-size: 10px; color: #64748b; margin-top: 20px;">Generated automatically via Disney Springs 3rd Shift Operations System</p>
    </div>
</body>
</html>`;

            const emlContent = `X-Unsent: 1
MIME-Version: 1.0
Date: ${new Date().toUTCString()}
Subject: ${subject}
Content-Type: text/html; charset=UTF-8

` + htmlBody;

            const blob = new Blob([emlContent], { type: 'message/rfc822' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `3rd_Shift_Recap_${appData.currentDate}_${leader.name.replace(/\s+/g, '_')}.eml`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("EML File downloaded successfully!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        window.onload = function() {
            const saved = localStorage.getItem('disney_3rd_shift_recap');
            if (saved) {
                try { appData = JSON.parse(saved); } catch(e) {}
            }
            renderApp();
        };
    </script>
</body>
</html>
